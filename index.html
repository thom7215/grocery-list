<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#12151c">
  <title>Family Grocery List</title>
  <style>
    :root {
      --bg: #12151c;
      --bg-accent: #1a1f2e;
      --surface: #1e2433;
      --surface-raised: #262d3f;
      --border: #343d52;
      --text: #f0f3f8;
      --muted: #9aa8be;
      --accent: #d4847c;
      --accent-soft: rgba(212, 132, 124, 0.18);
      --success: #6bc9a8;
      --danger: #e06c75;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(212, 132, 124, 0.08), transparent),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(107, 201, 168, 0.05), transparent);
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      gap: 0.75rem;
    }

    .header h1 { font-size: 1.5rem; font-weight: 700; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status { font-size: 0.78rem; color: var(--muted); }
    .status.ok { color: var(--success); }
    .status.error { color: var(--danger); }

    .icon-btn {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    .store-tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.65rem;
      margin-bottom: 0.75rem;
      scrollbar-width: none;
    }

    .store-tabs::-webkit-scrollbar { display: none; }

    .store-tab {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .store-tab.active {
      background: var(--accent-soft);
      border-color: rgba(212, 132, 124, 0.45);
      color: var(--text);
    }

    .store-tab.add-tab {
      padding: 0.45rem 0.7rem;
      font-size: 1rem;
      line-height: 1;
    }

    .store-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 0.4rem;
      margin-bottom: 0.65rem;
    }

    .add-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .add-bar input {
      flex: 1 1 140px;
      min-width: 0;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
    }

    .add-bar select {
      flex: 1 1 7.5rem;
      min-width: 0;
      padding: 0.85rem 0.65rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .add-bar input:focus, .add-bar select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-sm {
      padding: 0.45rem 0.75rem;
      font-size: 0.82rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
      gap: 0.5rem;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .staples {
      position: relative;
      margin-bottom: 0.85rem;
    }

    .staple-menu { position: relative; }

    .staple-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .staple-toggle:focus {
      outline: none;
      border-color: var(--accent);
    }

    .staple-caret { color: var(--muted); font-size: 0.8rem; }

    .staple-panel {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      top: calc(100% + 0.35rem);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-height: 16rem;
      overflow: auto;
      padding: 0.35rem;
    }

    .staple {
      display: flex;
      align-items: center;
      border-radius: 8px;
    }

    .staple.on-list { opacity: 0.5; }
    .staple:hover { background: var(--surface-raised); }

    .staple-chip, .staple-remove, .staple-add {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 0.92rem;
    }

    .staple-chip {
      flex: 1;
      text-align: left;
      padding: 0.65rem 0.35rem 0.65rem 0.7rem;
      font-weight: 600;
    }

    .staple-remove {
      color: var(--muted);
      padding: 0.55rem 0.7rem;
      font-size: 1.05rem;
      line-height: 1;
    }

    .staple-remove:hover { color: var(--danger); }

    .staple-add {
      width: 100%;
      text-align: left;
      padding: 0.7rem;
      color: var(--accent);
      font-weight: 700;
      border-top: 1px solid var(--border);
      margin-top: 0.25rem;
    }

    .staple-empty {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
      padding: 0.7rem;
    }

    .aisle { margin-bottom: 0.35rem; }
    .aisle.drop-into { outline: 1px dashed var(--accent); border-radius: 12px; }
    .aisle.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
    .aisle.dragging .aisle-items { display: none; }
    .aisle.dragging { opacity: 0.45; }

    .aisle-head {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin: 0.35rem 0 0.4rem;
    }

    .aisle-name {
      flex: 1;
      text-align: left;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.2rem 0;
    }

    .aisle-name:disabled { cursor: default; }

    .aisle-remove {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      line-height: 1;
    }

    .aisle-remove:hover { color: var(--danger); }

    .aisle-items {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-height: 2.4rem;
    }

    .aisle-empty {
      color: var(--muted);
      font-size: 0.82rem;
      font-style: italic;
      padding: 0.25rem 0.15rem 0.45rem;
    }

    .checked-block { margin-top: 0.85rem; }
    .checked-label { margin-bottom: 0.45rem; }

    .drag-handle {
      appearance: none;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: grab;
      touch-action: none;
      font-size: 0.95rem;
      letter-spacing: -0.2em;
      padding: 0.35rem 0.2rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .drag-handle:active { cursor: grabbing; }

    .item.dragging { opacity: 0.4; }
    .item.drop-before { box-shadow: inset 0 3px 0 var(--accent); }

    .staple-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.05rem;
      cursor: pointer;
      padding: 0.2rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .staple-btn.on { color: var(--accent); cursor: default; }

    .item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.75rem 0.7rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .item:active:not(.done) { background: var(--surface-raised); }
    .item.done { opacity: 0.55; }
    .item.done .item-text { text-decoration: line-through; }

    .item input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: var(--accent);
      flex-shrink: 0;
      pointer-events: none;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.25rem;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      font-style: italic;
      padding: 2rem 1rem;
    }

    .setup-banner {
      background: var(--accent-soft);
      border: 1px solid rgba(212, 132, 124, 0.35);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }

    .setup-banner button { margin-top: 0.75rem; }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: min(480px, 100%);
      max-height: 90vh;
      overflow: auto;
      box-shadow: var(--shadow);
    }

    .modal-header {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 { font-size: 1.15rem; }
    .modal-body { padding: 1.15rem; }

    .form-group { margin-bottom: 1rem; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .form-group input {
      width: 100%;
      background: var(--bg-accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font-size: 0.95rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.35rem;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .footer {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>🛒 Grocery List</h1>
      <div class="header-actions">
        <span class="status" id="status">Not connected</span>
        <button class="icon-btn" id="openSettings" title="Settings" type="button">⚙</button>
      </div>
    </header>

    <div class="setup-banner" id="setupBanner" hidden>
      Connect to your Cloudflare API so lists sync with the family dashboard on your TV.
      <button class="btn" type="button" id="setupBtn">Set up sync</button>
    </div>

    <div class="store-tabs" id="storeTabs"></div>

    <div class="store-toolbar">
      <button class="btn btn-secondary btn-sm" id="renameStore" type="button" hidden>Rename store</button>
      <button class="btn btn-danger btn-sm" id="deleteStore" type="button" hidden>Delete store</button>
    </div>

    <form class="add-bar" id="addForm">
      <input type="text" id="newItem" placeholder="Add an item…" autocomplete="off" enterkeyhint="done">
      <select id="aislePick" aria-label="Aisle"></select>
      <button class="btn" type="submit" id="addBtn">Add</button>
    </form>

    <div class="staples" id="staples" hidden></div>

    <div class="toolbar">
      <span class="section-label" id="listLabel">Items</span>
      <div class="toolbar-actions">
        <button class="btn btn-secondary btn-sm" id="addAisleBtn" type="button" hidden>Add aisle</button>
        <button class="btn btn-secondary btn-sm" id="undoBtn" type="button" hidden>Undo</button>
        <button class="btn btn-secondary btn-sm" id="clearDone" type="button" hidden>Clear checked</button>
      </div>
    </div>

    <div class="list" id="list"></div>
    <footer class="footer">Drag ⋮⋮ to reorder · open Staples to add one again</footer>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Sync settings</h2>
        <button class="close-btn" id="closeSettings" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="apiUrl">Cloud API URL</label>
          <input type="url" id="apiUrl" placeholder="https://family-dashboard-api.you.workers.dev">
          <p class="form-hint">Same Cloudflare Worker URL used by your Family Dashboard.</p>
        </div>
        <div class="form-group">
          <label for="familyToken">Family password</label>
          <input type="password" id="familyToken" placeholder="Shared household password" autocomplete="off">
        </div>
        <button class="btn" id="saveSettings" type="button">Save &amp; sync</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG_KEY = 'groceryListConfig';
    const ACTIVE_STORE_KEY = 'groceryListActiveStore';

    let config = loadConfig();
    let stores = [];
    let activeStoreId = localStorage.getItem(ACTIVE_STORE_KEY) || '';
    let busy = false;
    let undoSnapshot = null;
    let pendingAisle = '';
    let dragState = null;
    let suppressClick = false;
    let staplesOpen = false;

    function loadConfig() {
      try {
        const raw = localStorage.getItem(CONFIG_KEY);
        return raw ? JSON.parse(raw) : { apiUrl: '', familyToken: '' };
      } catch {
        return { apiUrl: '', familyToken: '' };
      }
    }

    function saveConfig() {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    }

    function isConfigured() {
      return Boolean(config.apiUrl?.trim() && config.familyToken);
    }

    function apiBase() {
      return config.apiUrl.trim().replace(/\/$/, '');
    }

    async function apiFetch(path, options = {}) {
      const res = await fetch(`${apiBase()}${path}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-Family-Token': config.familyToken,
          ...(options.headers || {}),
        },
      });
      if (!res.ok) throw new Error(`API ${res.status}`);
      return res.json();
    }

    function activeStore() {
      return stores.find(s => String(s.id) === String(activeStoreId)) || stores[0] || null;
    }

    function setStatus(text, kind = '') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = `status${kind ? ' ' + kind : ''}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function captureUndo() {
      undoSnapshot = JSON.parse(JSON.stringify(stores));
      document.getElementById('undoBtn').hidden = false;
    }

    function clearUndo() {
      undoSnapshot = null;
      document.getElementById('undoBtn').hidden = true;
    }

    async function applyStores(nextStores) {
      stores = nextStores;
      if (!stores.some(s => String(s.id) === String(activeStoreId))) {
        activeStoreId = stores[0]?.id || '';
        if (activeStoreId) localStorage.setItem(ACTIVE_STORE_KEY, activeStoreId);
      }
      const store = activeStore();
      const active = (store?.items || []).filter(i => !i.done).length;
      setStatus(`${active} item${active === 1 ? '' : 's'}`, 'ok');
      render();
    }

    async function loadStores() {
      if (busy || dragState) return;
      if (!isConfigured()) {
        document.getElementById('setupBanner').hidden = false;
        setStatus('Not connected');
        stores = [];
        render();
        return;
      }

      document.getElementById('setupBanner').hidden = true;
      try {
        setStatus('Syncing…');
        const data = await apiFetch('/api/grocery-stores');
        await applyStores(data.stores || []);
      } catch {
        setStatus('Sync failed', 'error');
      }
    }

    async function saveAllStores(nextStores) {
      const data = await apiFetch('/api/grocery-stores', {
        method: 'PUT',
        body: JSON.stringify({ stores: nextStores }),
      });
      await applyStores(data.stores || nextStores);
    }

    async function addStore(name) {
      if (!name.trim() || busy || !isConfigured()) return;
      busy = true;
      captureUndo();
      try {
        const data = await apiFetch('/api/grocery-stores', {
          method: 'POST',
          body: JSON.stringify({ name: name.trim() }),
        });
        await applyStores(data.stores || []);
        activeStoreId = data.stores[data.stores.length - 1]?.id || activeStoreId;
        localStorage.setItem(ACTIVE_STORE_KEY, activeStoreId);
        render();
      } catch {
        clearUndo();
        setStatus('Add store failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function renameStore(name) {
      const store = activeStore();
      if (!store || !name.trim() || busy) return;
      busy = true;
      captureUndo();
      try {
        const data = await apiFetch(`/api/grocery-stores/${store.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ name: name.trim() }),
        });
        await applyStores(data.stores || []);
      } catch {
        clearUndo();
        setStatus('Rename failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function deleteStore() {
      const store = activeStore();
      if (!store || stores.length <= 1 || busy) return;
      if (!confirm(`Delete "${store.name}" and all its items?`)) return;
      busy = true;
      captureUndo();
      try {
        const data = await apiFetch(`/api/grocery-stores/${store.id}`, { method: 'DELETE' });
        await applyStores(data.stores || []);
      } catch {
        clearUndo();
        setStatus('Delete store failed', 'error');
      } finally {
        busy = false;
      }
    }

    function cloneStore(store) {
      return {
        ...store,
        aisles: [...(store.aisles || [])],
        staples: (store.staples || []).map(s => ({ ...s })),
        items: (store.items || []).map(i => ({ ...i, aisle: i.aisle || '' })),
      };
    }

    function aisleNames(store) {
      const defined = (store.aisles || []).map(a => String(a).trim()).filter(Boolean);
      const extras = [];
      for (const item of store.items || []) {
        const name = String(item.aisle || '').trim();
        if (name && !defined.includes(name) && !extras.includes(name)) extras.push(name);
      }
      for (const staple of store.staples || []) {
        const name = String(staple.aisle || '').trim();
        if (name && !defined.includes(name) && !extras.includes(name)) extras.push(name);
      }
      return { defined, extras, all: [...defined, ...extras] };
    }

    function placeItem(items, item, beforeId) {
      const next = items.map(i => ({ ...i }));
      if (beforeId) {
        const at = next.findIndex(i => String(i.id) === String(beforeId));
        if (at >= 0) {
          next.splice(at, 0, item);
          return next;
        }
      }
      const aisle = item.aisle || '';
      let at = -1;
      for (let i = next.length - 1; i >= 0; i--) {
        if (!next[i].done && (next[i].aisle || '') === aisle) {
          at = i + 1;
          break;
        }
      }
      if (at < 0) {
        const firstDone = next.findIndex(i => i.done);
        at = firstDone < 0 ? next.length : firstDone;
      }
      next.splice(at, 0, item);
      return next;
    }

    function reorderItems(items, itemId, toAisle, beforeId) {
      const current = items.find(i => String(i.id) === String(itemId));
      if (!current) return items;
      if (beforeId && String(beforeId) === String(itemId) && (current.aisle || '') === (toAisle || '')) {
        return items;
      }
      const next = items.map(i => ({ ...i }));
      const from = next.findIndex(i => String(i.id) === String(itemId));
      const [item] = next.splice(from, 1);
      item.aisle = toAisle || '';
      if (beforeId && String(beforeId) !== String(itemId)) {
        const at = next.findIndex(i => String(i.id) === String(beforeId));
        if (at >= 0) {
          next.splice(at, 0, item);
          return next;
        }
      }
      return placeItem(next, item, null);
    }

    function reorderAisles(names, name, beforeName) {
      const next = [...names];
      const from = next.indexOf(name);
      if (from < 0) return next;
      next.splice(from, 1);
      if (!beforeName) {
        next.push(name);
        return next;
      }
      const at = next.indexOf(beforeName);
      if (at < 0) next.push(name);
      else next.splice(at, 0, name);
      return next;
    }

    async function commitStore(nextStore, statusText) {
      if (busy || !isConfigured()) return;
      busy = true;
      captureUndo();
      try {
        if (statusText) setStatus(statusText);
        const nextStores = stores.map(s => String(s.id) === String(nextStore.id) ? nextStore : s);
        await saveAllStores(nextStores);
      } catch {
        clearUndo();
        setStatus('Save failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function addItem(text, aisle) {
      const store = activeStore();
      const trimmed = text.trim();
      if (!store || !trimmed || busy || !isConfigured()) return;
      const next = cloneStore(store);
      const cleanAisle = (aisle || '').trim();
      if (cleanAisle && !next.aisles.includes(cleanAisle)) next.aisles.push(cleanAisle);
      next.items = placeItem(next.items, {
        id: Date.now(),
        text: trimmed,
        done: false,
        aisle: cleanAisle,
      }, null);
      document.getElementById('addBtn').disabled = true;
      try {
        await commitStore(next, 'Saving…');
      } finally {
        document.getElementById('addBtn').disabled = false;
      }
    }

    async function createAisle(name) {
      const trimmed = name.trim();
      const store = activeStore();
      if (!trimmed || !store || busy) {
        renderAislePick();
        return;
      }
      const existing = aisleNames(store).all.find(a => a.toLowerCase() === trimmed.toLowerCase());
      pendingAisle = existing || trimmed;
      if (existing) {
        renderAislePick();
        return;
      }
      const next = cloneStore(store);
      next.aisles.push(trimmed);
      await commitStore(next, 'Saving…');
    }

    async function renameAisle(oldName) {
      const store = activeStore();
      if (!store || busy) return;
      const name = prompt('Rename aisle:', oldName);
      const trimmed = name?.trim() || '';
      if (!trimmed || trimmed === oldName) return;
      if (aisleNames(store).all.some(a => a.toLowerCase() === trimmed.toLowerCase() && a !== oldName)) return;
      const next = cloneStore(store);
      next.aisles = aisleNames(store).all.map(a => a === oldName ? trimmed : a);
      next.items = next.items.map(i => (i.aisle || '') === oldName ? { ...i, aisle: trimmed } : i);
      next.staples = next.staples.map(s => (s.aisle || '') === oldName ? { ...s, aisle: trimmed } : s);
      if (pendingAisle === oldName) pendingAisle = trimmed;
      await commitStore(next, 'Saving…');
    }

    async function deleteAisle(name) {
      const store = activeStore();
      if (!store || busy) return;
      if (!confirm(`Remove the "${name}" aisle? Items move to Uncategorized.`)) return;
      const next = cloneStore(store);
      next.aisles = aisleNames(store).all.filter(a => a !== name);
      next.items = next.items.map(i => (i.aisle || '') === name ? { ...i, aisle: '' } : i);
      next.staples = next.staples.map(s => (s.aisle || '') === name ? { ...s, aisle: '' } : s);
      if (pendingAisle === name) pendingAisle = '';
      await commitStore(next, 'Saving…');
    }

    async function createStaple(text, aisle) {
      const trimmed = text.trim();
      const store = activeStore();
      if (!store || !trimmed || busy) return;
      const next = cloneStore(store);
      if (next.staples.some(s => s.text.toLowerCase() === trimmed.toLowerCase())) return;
      const cleanAisle = (aisle || '').trim();
      if (cleanAisle && !next.aisles.some(a => a.toLowerCase() === cleanAisle.toLowerCase())) {
        next.aisles.push(cleanAisle);
      }
      next.staples.push({
        id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
        text: trimmed,
        aisle: cleanAisle,
      });
      await commitStore(next, 'Saving…');
    }

    async function removeStaple(id) {
      const store = activeStore();
      if (!store || busy) return;
      const next = cloneStore(store);
      next.staples = next.staples.filter(s => String(s.id) !== String(id));
      await commitStore(next, 'Saving…');
    }

    async function addStapleToList(stapleId) {
      const store = activeStore();
      if (!store || busy) return;
      const staple = (store.staples || []).find(s => String(s.id) === String(stapleId));
      if (!staple) return;
      const next = cloneStore(store);
      const existing = next.items.find(i => i.text.toLowerCase() === staple.text.toLowerCase());
      if (existing && !existing.done) return;
      const cleanAisle = staple.aisle || '';
      if (cleanAisle && !next.aisles.includes(cleanAisle)) next.aisles.push(cleanAisle);
      if (existing) {
        next.items = next.items.filter(i => String(i.id) !== String(existing.id));
        existing.done = false;
        existing.aisle = cleanAisle;
        next.items = placeItem(next.items, existing, null);
      } else {
        next.items = placeItem(next.items, {
          id: Date.now(),
          text: staple.text,
          done: false,
          aisle: cleanAisle,
        }, null);
      }
      await commitStore(next, 'Saving…');
    }

    async function saveItemAsStaple(itemId) {
      const store = activeStore();
      const item = (store?.items || []).find(i => String(i.id) === String(itemId));
      if (!item) return;
      await createStaple(item.text, item.aisle || '');
    }

    async function toggleItem(id, done) {
      const store = activeStore();
      if (!store || busy || !isConfigured()) return;
      busy = true;
      captureUndo();
      try {
        const data = await apiFetch(`/api/grocery-stores/${store.id}/items/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ done }),
        });
        await applyStores(data.stores || []);
      } catch {
        clearUndo();
        setStatus('Update failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function deleteItem(id) {
      const store = activeStore();
      if (!store || busy || !isConfigured()) return;
      busy = true;
      captureUndo();
      try {
        const data = await apiFetch(`/api/grocery-stores/${store.id}/items/${id}`, { method: 'DELETE' });
        await applyStores(data.stores || []);
      } catch {
        clearUndo();
        setStatus('Delete failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function clearDone() {
      const store = activeStore();
      if (!store || busy || !isConfigured()) return;
      const remaining = (store.items || []).filter(i => !i.done);
      if (remaining.length === (store.items || []).length) return;
      busy = true;
      captureUndo();
      try {
        const nextStores = stores.map(s =>
          s.id === store.id ? { ...s, items: remaining } : s,
        );
        await saveAllStores(nextStores);
      } catch {
        clearUndo();
        setStatus('Clear failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function undoLast() {
      if (!undoSnapshot || busy || !isConfigured()) return;
      busy = true;
      const previous = undoSnapshot;
      clearUndo();
      try {
        setStatus('Undoing…');
        await saveAllStores(previous);
      } catch {
        undoSnapshot = previous;
        document.getElementById('undoBtn').hidden = false;
        setStatus('Undo failed', 'error');
      } finally {
        busy = false;
      }
    }

    function renderStoreTabs() {
      const el = document.getElementById('storeTabs');
      if (!stores.length) {
        el.innerHTML = '';
        document.getElementById('renameStore').hidden = true;
        document.getElementById('deleteStore').hidden = true;
        document.getElementById('addAisleBtn').hidden = true;
        return;
      }

      el.innerHTML = stores.map(store => `
        <button type="button" class="store-tab${String(store.id) === String(activeStoreId) ? ' active' : ''}" data-store-id="${store.id}">
          ${esc(store.name)}
        </button>`).join('') + `
        <button type="button" class="store-tab add-tab" id="addStoreTab" title="Add store">+</button>`;

      document.getElementById('renameStore').hidden = false;
      document.getElementById('deleteStore').hidden = stores.length <= 1;
      document.getElementById('addAisleBtn').hidden = false;
    }

    function renderAislePick() {
      const select = document.getElementById('aislePick');
      const store = activeStore();
      const names = store ? aisleNames(store).all : [];
      if (pendingAisle && !names.includes(pendingAisle)) pendingAisle = '';
      select.innerHTML = [`<option value="">Uncategorized</option>`]
        .concat(names.map(name => `<option value="${esc(name)}">${esc(name)}</option>`))
        .concat(`<option value="__new__">New aisle…</option>`)
        .join('');
      select.value = pendingAisle;
    }

    function renderStaples() {
      const el = document.getElementById('staples');
      const store = activeStore();
      if (!store) {
        el.hidden = true;
        el.innerHTML = '';
        return;
      }
      el.hidden = false;
      const staples = store.staples || [];
      const activeText = new Set(
        (store.items || []).filter(i => !i.done).map(i => i.text.toLowerCase()),
      );
      const options = staples.map(staple => {
        const onList = activeText.has(staple.text.toLowerCase());
        const aisle = staple.aisle ? ` · ${esc(staple.aisle)}` : '';
        const note = onList ? ' · on list' : '';
        return `<div class="staple${onList ? ' on-list' : ''}" role="option">
          <button type="button" class="staple-chip" data-staple-id="${esc(String(staple.id))}">${esc(staple.text)}${aisle}${note}</button>
          <button type="button" class="staple-remove" data-remove-staple="${esc(String(staple.id))}" aria-label="Remove staple ${esc(staple.text)}">&times;</button>
        </div>`;
      }).join('');
      el.innerHTML = `
        <div class="staple-menu">
          <button type="button" class="staple-toggle" id="stapleToggle" aria-expanded="${staplesOpen ? 'true' : 'false'}" aria-haspopup="listbox">
            Staples${staples.length ? ` (${staples.length})` : ''}
            <span class="staple-caret" aria-hidden="true">${staplesOpen ? '▴' : '▾'}</span>
          </button>
          <div class="staple-panel" id="staplePanel" role="listbox" aria-label="Staples" ${staplesOpen ? '' : 'hidden'}>
            ${options || '<div class="staple-empty">No staples yet. Star an item or add one.</div>'}
            <button type="button" class="staple-add" id="addStapleBtn">Add staple</button>
          </div>
        </div>`;
    }

    function renderItem(item, staples) {
      const starred = staples.some(s => s.text.toLowerCase() === item.text.toLowerCase());
      const id = esc(String(item.id));
      return `<div class="item${item.done ? ' done' : ''}" data-id="${id}" data-done="${item.done ? 'true' : 'false'}" data-aisle="${esc(item.aisle || '')}">
        ${item.done ? '' : `<button type="button" class="drag-handle" data-drag="item" aria-label="Drag to reorder ${esc(item.text)}">⋮⋮</button>`}
        <input type="checkbox" ${item.done ? 'checked' : ''} tabindex="-1" aria-hidden="true">
        <span class="item-text">${esc(item.text)}</span>
        ${item.done ? '' : `<button type="button" class="staple-btn${starred ? ' on' : ''}" data-save-staple="${id}" aria-label="${starred ? `${esc(item.text)} is a staple` : `Save ${esc(item.text)} as a staple`}" ${starred ? 'disabled' : ''}>${starred ? '★' : '☆'}</button>`}
        <button class="delete-btn" type="button" data-delete="${id}" aria-label="Remove ${esc(item.text)}">&times;</button>
      </div>`;
    }

    function renderAisleSection(name, label, items, staples, movable) {
      const body = items.length
        ? items.map(item => renderItem(item, staples)).join('')
        : '<div class="aisle-empty">Nothing in this aisle</div>';
      return `<section class="aisle" data-aisle="${esc(name)}">
        <div class="aisle-head">
          ${movable ? `<button type="button" class="drag-handle" data-drag="aisle" aria-label="Reorder ${esc(label)} aisle">⋮⋮</button>` : ''}
          ${movable
            ? `<button type="button" class="aisle-name" data-rename-aisle="${esc(name)}">${esc(label)}</button>
               <button type="button" class="aisle-remove" data-delete-aisle="${esc(name)}" aria-label="Remove ${esc(label)} aisle">&times;</button>`
            : `<span class="aisle-name">${esc(label)}</span>`}
        </div>
        <div class="aisle-items">${body}</div>
      </section>`;
    }

    function renderDone(done, staples) {
      if (!done.length) return '';
      return `<section class="checked-block">
        <div class="section-label checked-label">Checked</div>
        <div class="aisle-items">${done.map(item => renderItem(item, staples)).join('')}</div>
      </section>`;
    }

    function renderList() {
      const el = document.getElementById('list');
      const clearBtn = document.getElementById('clearDone');
      const store = activeStore();
      const items = store?.items || [];
      const active = items.filter(i => !i.done);
      const done = items.filter(i => i.done);
      const staples = store?.staples || [];

      document.getElementById('listLabel').textContent = store
        ? `${active.length} to buy${done.length ? ` · ${done.length} checked` : ''}`
        : 'Items';

      clearBtn.hidden = done.length === 0;

      if (!store) {
        el.innerHTML = `<div class="empty">${isConfigured() ? 'Add a store to get started.' : 'Set up sync to get started.'}</div>`;
        return;
      }

      if (!active.length && !done.length) {
        el.innerHTML = `<div class="empty">Nothing on the ${esc(store.name)} list yet.</div>`;
        return;
      }

      const defined = aisleNames(store).defined;
      const buckets = new Map();
      const uncategorized = [];
      for (const item of active) {
        const aisle = String(item.aisle || '').trim();
        if (!aisle) {
          uncategorized.push(item);
          continue;
        }
        if (!buckets.has(aisle)) buckets.set(aisle, []);
        buckets.get(aisle).push(item);
      }
      const orderedNames = [
        ...defined.filter(name => (buckets.get(name) || []).length),
        ...[...buckets.keys()].filter(name => !defined.includes(name)),
      ];

      let html = orderedNames.map(name => renderAisleSection(name, name, buckets.get(name), staples, true)).join('');
      if (uncategorized.length) html += renderAisleSection('', 'Uncategorized', uncategorized, staples, false);
      html += renderDone(done, staples);
      el.innerHTML = html;
    }

    function render() {
      renderStoreTabs();
      renderAislePick();
      renderStaples();
      renderList();
    }

    function openSettings() {
      document.getElementById('apiUrl').value = config.apiUrl || '';
      document.getElementById('familyToken').value = config.familyToken || '';
      document.getElementById('settingsOverlay').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('open');
    }

    document.getElementById('storeTabs').addEventListener('click', (e) => {
      if (e.target.id === 'addStoreTab') {
        const name = prompt('Store name (e.g. Costco, Walmart):');
        if (name) void addStore(name);
        return;
      }
      const tab = e.target.closest('[data-store-id]');
      if (!tab) return;
      activeStoreId = tab.dataset.storeId;
      localStorage.setItem(ACTIVE_STORE_KEY, activeStoreId);
      render();
    });

    document.getElementById('renameStore').addEventListener('click', () => {
      const store = activeStore();
      if (!store) return;
      const name = prompt('Rename store:', store.name);
      if (name && name.trim() !== store.name) void renameStore(name);
    });

    document.getElementById('deleteStore').addEventListener('click', () => void deleteStore());

    function addTypedItem(aisle) {
      const input = document.getElementById('newItem');
      const text = input.value;
      if (!text.trim()) return;
      input.value = '';
      void addItem(text, aisle);
    }

    document.getElementById('aislePick').addEventListener('change', () => {
      const value = document.getElementById('aislePick').value;
      if (value === '__new__') {
        const name = prompt('Aisle name (e.g. Produce, Dairy):');
        const trimmed = name?.trim() || '';
        if (!trimmed) {
          renderAislePick();
          return;
        }
        pendingAisle = trimmed;
        if (document.getElementById('newItem').value.trim()) addTypedItem(trimmed);
        else void createAisle(trimmed);
        return;
      }
      pendingAisle = value;
      addTypedItem(value);
    });

    document.getElementById('addAisleBtn').addEventListener('click', () => {
      const name = prompt('Aisle name (e.g. Produce, Dairy):');
      if (name) void createAisle(name);
    });

    document.getElementById('staples').addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.target.id === 'stapleToggle') {
        staplesOpen = !staplesOpen;
        renderStaples();
        return;
      }
      if (e.target.id === 'addStapleBtn') {
        const name = prompt('Staple name (e.g. Milk, Eggs):');
        if (name) {
          staplesOpen = true;
          void createStaple(name, pendingAisle);
        }
        return;
      }
      const remove = e.target.closest('[data-remove-staple]');
      if (remove) {
        staplesOpen = true;
        void removeStaple(remove.dataset.removeStaple);
        return;
      }
      const chip = e.target.closest('[data-staple-id]');
      if (chip) {
        staplesOpen = false;
        void addStapleToList(chip.dataset.stapleId);
      }
    });

    document.addEventListener('click', () => {
      if (!staplesOpen) return;
      staplesOpen = false;
      renderStaples();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && staplesOpen) {
        staplesOpen = false;
        renderStaples();
      }
    });

    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('newItem');
      const text = input.value;
      if (!text.trim()) return;
      input.value = '';
      void addItem(text, pendingAisle);
    });

    document.getElementById('list').addEventListener('click', (e) => {
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      const rename = e.target.closest('[data-rename-aisle]');
      if (rename) {
        void renameAisle(rename.dataset.renameAisle);
        return;
      }
      const deleteAisleBtn = e.target.closest('[data-delete-aisle]');
      if (deleteAisleBtn) {
        void deleteAisle(deleteAisleBtn.dataset.deleteAisle);
        return;
      }
      const saveStaple = e.target.closest('[data-save-staple]');
      if (saveStaple) {
        void saveItemAsStaple(saveStaple.dataset.saveStaple);
        return;
      }
      if (e.target.closest('.drag-handle')) return;
      const deleteBtn = e.target.closest('.delete-btn');
      if (deleteBtn) {
        e.stopPropagation();
        const id = deleteBtn.dataset.delete;
        if (id) void deleteItem(id);
        return;
      }
      const row = e.target.closest('.item[data-id]');
      if (!row) return;
      void toggleItem(row.dataset.id, row.dataset.done !== 'true');
    });

    function attrSel(attr, value) {
      const safe = String(value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
      return `[${attr}="${safe}"]`;
    }

    function clearDragStyles() {
      document.querySelectorAll('.dragging, .drop-before, .drop-into').forEach(el => {
        el.classList.remove('dragging', 'drop-before', 'drop-into');
      });
    }

    function findDrop(clientY) {
      if (!dragState) return null;
      if (dragState.kind === 'aisle') {
        const sections = [...document.querySelectorAll('.aisle')].filter(el => el.dataset.aisle && el.dataset.aisle !== dragState.aisleName);
        for (const section of sections) {
          const rect = section.getBoundingClientRect();
          if (clientY < rect.top + rect.height / 2) return { type: 'aisle', beforeName: section.dataset.aisle };
        }
        return sections.length ? { type: 'aisle', beforeName: '' } : null;
      }

      const sections = [...document.querySelectorAll('#list .aisle')];
      if (!sections.length) return null;
      const section = sections.find(el => {
        const rect = el.getBoundingClientRect();
        return clientY >= rect.top && clientY <= rect.bottom;
      });
      if (!section) {
        const first = sections[0].getBoundingClientRect();
        if (clientY < first.top) {
          const firstRow = [...sections[0].querySelectorAll('.item:not(.done)')].find(el => el.dataset.id !== dragState.itemId);
          return { type: 'item', aisle: sections[0].dataset.aisle || '', beforeId: firstRow?.dataset.id || '' };
        }
        return null;
      }
      const rows = [...section.querySelectorAll('.item:not(.done)')].filter(el => el.dataset.id !== dragState.itemId);
      for (const row of rows) {
        const rect = row.getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) {
          return { type: 'item', aisle: section.dataset.aisle || '', beforeId: row.dataset.id };
        }
      }
      return { type: 'item', aisle: section.dataset.aisle || '', beforeId: '' };
    }

    function applyDragHint() {
      clearDragStyles();
      if (!dragState) return;
      const origin = dragState.kind === 'item'
        ? document.querySelector(`#list .item${attrSel('data-id', dragState.itemId)}`)
        : document.querySelector(`#list .aisle${attrSel('data-aisle', dragState.aisleName)}`);
      origin?.classList.add('dragging');
      const hint = dragState.hint;
      if (!hint) return;
      if (hint.type === 'item' && hint.beforeId) {
        document.querySelector(`#list .item${attrSel('data-id', hint.beforeId)}`)?.classList.add('drop-before');
      } else if (hint.type === 'item') {
        document.querySelector(`#list .aisle${attrSel('data-aisle', hint.aisle)}`)?.classList.add('drop-into');
      } else if (hint.beforeName) {
        document.querySelector(`#list .aisle${attrSel('data-aisle', hint.beforeName)}`)?.classList.add('drop-before');
      } else {
        const sections = [...document.querySelectorAll('#list .aisle')].filter(el => el.dataset.aisle);
        sections[sections.length - 1]?.classList.add('drop-into');
      }
    }

    async function finishDrag(commit) {
      const state = dragState;
      dragState = null;
      clearDragStyles();
      if (!commit || !state?.moved || !state.hint) return;
      const store = activeStore();
      if (!store) return;
      const next = cloneStore(store);
      if (state.kind === 'item') {
        const items = reorderItems(next.items, state.itemId, state.hint.aisle, state.hint.beforeId || null);
        if (JSON.stringify(items) === JSON.stringify(next.items)) return;
        next.items = items;
      } else {
        const before = aisleNames(store).all;
        const aisles = reorderAisles(before, state.aisleName, state.hint.beforeName || null);
        if (JSON.stringify(aisles) === JSON.stringify(before)) return;
        next.aisles = aisles;
      }
      await commitStore(next);
    }

    function onDragPointerDown(e) {
      const handle = e.target.closest('.drag-handle');
      if (!handle || busy) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const item = handle.closest('.item');
      const aisle = handle.closest('.aisle');
      dragState = {
        pointerId: e.pointerId,
        kind: handle.dataset.drag,
        itemId: item?.dataset.id || '',
        aisleName: aisle?.dataset.aisle || '',
        startY: e.clientY,
        moved: false,
        hint: null,
      };
      try { handle.setPointerCapture(e.pointerId); } catch { /* untrusted events still drag via bubbling */ }
    }

    function onDragPointerMove(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      if (!dragState.moved && Math.abs(e.clientY - dragState.startY) < 8) return;
      dragState.moved = true;
      e.preventDefault();
      if (e.clientY < 72) window.scrollBy(0, -12);
      else if (e.clientY > window.innerHeight - 72) window.scrollBy(0, 12);
      dragState.hint = findDrop(e.clientY);
      applyDragHint();
    }

    function onDragPointerUp(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      const moved = dragState.moved;
      if (moved) {
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 400);
      }
      void finishDrag(moved);
    }

    const listEl = document.getElementById('list');
    listEl.addEventListener('pointerdown', onDragPointerDown);
    listEl.addEventListener('pointermove', onDragPointerMove, { passive: false });
    listEl.addEventListener('pointerup', onDragPointerUp);
    listEl.addEventListener('pointercancel', (e) => {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      void finishDrag(false);
    });

    document.getElementById('undoBtn').addEventListener('click', () => void undoLast());
    document.getElementById('clearDone').addEventListener('click', () => void clearDone());
    document.getElementById('openSettings').addEventListener('click', openSettings);
    document.getElementById('setupBtn').addEventListener('click', openSettings);
    document.getElementById('closeSettings').addEventListener('click', closeSettings);
    document.getElementById('saveSettings').addEventListener('click', () => {
      config.apiUrl = document.getElementById('apiUrl').value.trim();
      config.familyToken = document.getElementById('familyToken').value;
      saveConfig();
      closeSettings();
      void loadStores();
    });
    document.getElementById('settingsOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'settingsOverlay') closeSettings();
    });

    setInterval(() => void loadStores(), 30 * 1000);
    void loadStores();
  </script>
</body>
</html>
