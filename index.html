<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#12151c">
  <title>Family Grocery List</title>
  <style>
    :root {
      --bg: #12151c;
      --bg-accent: #1a1f2e;
      --surface: #1e2433;
      --surface-raised: #262d3f;
      --border: #343d52;
      --text: #f0f3f8;
      --muted: #9aa8be;
      --accent: #d4847c;
      --accent-soft: rgba(212, 132, 124, 0.18);
      --success: #6bc9a8;
      --danger: #e06c75;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(212, 132, 124, 0.08), transparent),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(107, 201, 168, 0.05), transparent);
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 0.75rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .status.ok { color: var(--success); }
    .status.error { color: var(--danger); }

    .icon-btn {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    .add-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .add-bar input {
      flex: 1;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
    }

    .add-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
      gap: 0.5rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 0.9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .item:active:not(.done) {
      background: var(--surface-raised);
    }

    .item.done {
      opacity: 0.55;
    }

    .item.done .item-text {
      text-decoration: line-through;
    }

    .item input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: var(--accent);
      flex-shrink: 0;
      pointer-events: none;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.25rem;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      font-style: italic;
      padding: 2rem 1rem;
    }

    .setup-banner {
      background: var(--accent-soft);
      border: 1px solid rgba(212, 132, 124, 0.35);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }

    .setup-banner button {
      margin-top: 0.75rem;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: min(480px, 100%);
      max-height: 90vh;
      overflow: auto;
      box-shadow: var(--shadow);
    }

    .modal-header {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 { font-size: 1.15rem; }

    .modal-body { padding: 1.15rem; }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .form-group input {
      width: 100%;
      background: var(--bg-accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font-size: 0.95rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.35rem;
      line-height: 1.45;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .footer {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>🛒 Grocery List</h1>
      <div class="header-actions">
        <span class="status" id="status">Not connected</span>
        <button class="icon-btn" id="openSettings" title="Settings" type="button">⚙</button>
      </div>
    </header>

    <div class="setup-banner" id="setupBanner" hidden>
      Connect to your Cloudflare API so the list syncs with the family dashboard on your TV.
      <button class="btn" type="button" id="setupBtn">Set up sync</button>
    </div>

    <form class="add-bar" id="addForm">
      <input type="text" id="newItem" placeholder="Add an item…" autocomplete="off" enterkeyhint="done">
      <button class="btn" type="submit" id="addBtn">Add</button>
    </form>

    <div class="toolbar">
      <span class="section-label" id="listLabel">Items</span>
      <button class="btn btn-secondary" id="clearDone" type="button" hidden>Clear checked</button>
    </div>

    <div class="list" id="list"></div>

    <footer class="footer">Syncs with your Family Dashboard TV display</footer>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Sync settings</h2>
        <button class="close-btn" id="closeSettings" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="apiUrl">Cloud API URL</label>
          <input type="url" id="apiUrl" placeholder="https://family-dashboard-api.you.workers.dev">
          <p class="form-hint">Same Cloudflare Worker URL used by your Family Dashboard.</p>
        </div>
        <div class="form-group">
          <label for="familyToken">Family password</label>
          <input type="password" id="familyToken" placeholder="Shared household password" autocomplete="off">
          <p class="form-hint">Same password set as <code>FAMILY_TOKEN</code> in Cloudflare.</p>
        </div>
        <button class="btn" id="saveSettings" type="button">Save &amp; sync</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG_KEY = 'groceryListConfig';
    let config = loadConfig();
    let items = [];
    let busy = false;

    function loadConfig() {
      try {
        const raw = localStorage.getItem(CONFIG_KEY);
        return raw ? JSON.parse(raw) : { apiUrl: '', familyToken: '' };
      } catch {
        return { apiUrl: '', familyToken: '' };
      }
    }

    function saveConfig() {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    }

    function isConfigured() {
      return Boolean(config.apiUrl?.trim() && config.familyToken);
    }

    function apiBase() {
      return config.apiUrl.trim().replace(/\/$/, '');
    }

    async function apiFetch(path, options = {}) {
      const res = await fetch(`${apiBase()}${path}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-Family-Token': config.familyToken,
          ...(options.headers || {}),
        },
      });
      if (!res.ok) throw new Error(`API ${res.status}`);
      return res.json();
    }

    function setStatus(text, kind = '') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = `status${kind ? ' ' + kind : ''}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    async function loadItems() {
      if (!isConfigured()) {
        document.getElementById('setupBanner').hidden = false;
        setStatus('Not connected');
        items = [];
        render();
        return;
      }

      document.getElementById('setupBanner').hidden = true;
      try {
        setStatus('Syncing…');
        items = await apiFetch('/api/groceries');
        const active = items.filter(i => !i.done).length;
        setStatus(`${active} item${active === 1 ? '' : 's'}`, 'ok');
      } catch {
        setStatus('Sync failed', 'error');
      }
      render();
    }

    async function addItem(text) {
      if (!text.trim() || busy || !isConfigured()) return;
      busy = true;
      document.getElementById('addBtn').disabled = true;
      try {
        setStatus('Saving…');
        items = await apiFetch('/api/groceries', {
          method: 'POST',
          body: JSON.stringify({ text: text.trim() }),
        });
        const active = items.filter(i => !i.done).length;
        setStatus(`${active} item${active === 1 ? '' : 's'}`, 'ok');
        render();
      } catch {
        setStatus('Add failed', 'error');
      } finally {
        busy = false;
        document.getElementById('addBtn').disabled = false;
      }
    }

    async function toggleItem(id, done) {
      if (busy || !isConfigured()) return;
      busy = true;
      try {
        items = await apiFetch(`/api/groceries/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ done }),
        });
        const active = items.filter(i => !i.done).length;
        setStatus(`${active} item${active === 1 ? '' : 's'}`, 'ok');
        render();
      } catch {
        setStatus('Update failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function deleteItem(id) {
      if (busy || !isConfigured()) return;
      busy = true;
      try {
        items = await apiFetch(`/api/groceries/${id}`, { method: 'DELETE' });
        const active = items.filter(i => !i.done).length;
        setStatus(`${active} item${active === 1 ? '' : 's'}`, 'ok');
        render();
      } catch {
        setStatus('Delete failed', 'error');
      } finally {
        busy = false;
      }
    }

    async function clearDone() {
      if (busy || !isConfigured()) return;
      const remaining = items.filter(i => !i.done);
      if (remaining.length === items.length) return;
      busy = true;
      try {
        await apiFetch('/api/groceries', {
          method: 'PUT',
          body: JSON.stringify(remaining),
        });
        items = remaining;
        setStatus(`${items.length} item${items.length === 1 ? '' : 's'}`, 'ok');
        render();
      } catch {
        setStatus('Clear failed', 'error');
      } finally {
        busy = false;
      }
    }

    function render() {
      const el = document.getElementById('list');
      const clearBtn = document.getElementById('clearDone');
      const active = items.filter(i => !i.done);
      const done = items.filter(i => i.done);

      document.getElementById('listLabel').textContent =
        items.length ? `${active.length} to buy${done.length ? ` · ${done.length} checked` : ''}` : 'Items';

      clearBtn.hidden = done.length === 0;

      if (!items.length) {
        el.innerHTML = `<div class="empty">${isConfigured() ? 'Nothing on the list yet. Add something above.' : 'Set up sync to get started.'}</div>`;
        return;
      }

      const renderRow = (item) => `
        <div class="item${item.done ? ' done' : ''}" data-id="${item.id}" data-done="${item.done}">
          <input type="checkbox" ${item.done ? 'checked' : ''} tabindex="-1" aria-hidden="true">
          <span class="item-text">${esc(item.text)}</span>
          <button class="delete-btn" type="button" data-delete="${item.id}" aria-label="Remove ${esc(item.text)}">&times;</button>
        </div>`;

      el.innerHTML = [...active, ...done].map(renderRow).join('');
    }

    function openSettings() {
      document.getElementById('apiUrl').value = config.apiUrl || '';
      document.getElementById('familyToken').value = config.familyToken || '';
      document.getElementById('settingsOverlay').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('open');
    }

    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('newItem');
      const text = input.value;
      input.value = '';
      void addItem(text);
    });

    document.getElementById('list').addEventListener('click', (e) => {
      const deleteBtn = e.target.closest('.delete-btn');
      if (deleteBtn) {
        e.stopPropagation();
        const id = deleteBtn.dataset.delete;
        if (id) void deleteItem(id);
        return;
      }

      const row = e.target.closest('.item[data-id]');
      if (!row) return;
      void toggleItem(row.dataset.id, row.dataset.done !== 'true');
    });

    document.getElementById('clearDone').addEventListener('click', () => void clearDone());
    document.getElementById('openSettings').addEventListener('click', openSettings);
    document.getElementById('setupBtn').addEventListener('click', openSettings);
    document.getElementById('closeSettings').addEventListener('click', closeSettings);
    document.getElementById('saveSettings').addEventListener('click', () => {
      config.apiUrl = document.getElementById('apiUrl').value.trim();
      config.familyToken = document.getElementById('familyToken').value;
      saveConfig();
      closeSettings();
      void loadItems();
    });

    document.getElementById('settingsOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'settingsOverlay') closeSettings();
    });

    setInterval(() => void loadItems(), 30 * 1000);
    void loadItems();
  </script>
</body>
</html>
